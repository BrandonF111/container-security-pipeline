name: Security Scan - Vulnerable Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'vulnerable-app/**'
      - '.github/workflows/scan-vulnerable.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan-vulnerable-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vulnerable image
        run: |
          docker build -f vulnerable-app/Dockerfile.vulnerable -t vulnerable-demo:latest vulnerable-app/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-demo:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-report.txt
          
      - name: Run Trivy - only fixable vulns
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-demo:latest
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy JSON output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-demo:latest
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json)
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 10 ]; then
            echo "Security policy violation: Too many high-severity vulnerabilities"
            echo "This would block deployment in production"
          fi

      - name: Scan for secrets
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --scanners secret vulnerable-demo:latest

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: |
            trivy-report.txt
            trivy-report.json

      - name: Display summary
        run: |
          echo "## Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerable Image Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: vulnerable-demo:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
