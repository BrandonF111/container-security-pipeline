name: Security Scan - Secure Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'vulnerable-app/**'
      - '.github/workflows/scan-secure.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan-secure-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build secure image
        run: |
          docker build -f vulnerable-app/Dockerfile.secure -t secure-demo:latest vulnerable-app/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-demo:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-report-secure.txt
          ignore-unfixed: true

      - name: Run Trivy JSON output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-demo:latest
          format: json
          output: trivy-report-secure.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Security policy check
        run: |
          run: |
            CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL" and .FixedVersion != "")] | length' trivy-report-secure.json)
            HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" and .FixedVersion != "")] | length' trivy-report-secure.json)
            echo "Critical vulnerabilities (with fixes): $CRITICAL_COUNT"
            echo "High vulnerabilities (with fixes): $HIGH_COUNT"
            if [ "$CRITICAL_COUNT" -eq 0 ] && [ "$HIGH_COUNT" -lt 5 ]; then
              echo "Security policy passed: Image is safe to deploy"
            else
              echo "Security policy failed: Image has too many vulnerabilities"
              exit 1
            fi

      - name: Upload secure image report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-secure-report
          path: |
            trivy-report-secure.txt
            trivy-report-secure.json

      - name: Display summary
        run: |
          echo "## Security Scan Results - Secure Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remediated Image Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: secure-demo:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat trivy-report-secure.txt >> $GITHUB_STEP_SUMMARY
