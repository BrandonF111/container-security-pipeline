name: Grype Security Scan

on:
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: 'Path to Dockerfile (i.e. ./vulnerable-app/dockerfile.secure)'
        required: true
        type: string
      image_name:
        description: 'Name for the Docker image (i.e., myapp:latest)'
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          DOCKERFILE_DIR=$(dirname ${{ inputs.dockerfile_path }})
          docker build -t ${{ inputs.image_name }} -f ${{ inputs.dockerfile_path }} $DOCKERFILE_DIR

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype scan
        run: |
          grype ${{inputs.image_name }} -o json > grype-results.json
          grype ${{inputs.image_name }} -o table> grype-results.txt
          grype ${{inputs.image_name }} -o table

      - name: Check vulnerability thresholds
        run: |
          CRITICAL_COUNT=$(jq '[.matches[] | select(.vulnerability.severity=="Critical")] | length' grype-results.json)
          HIGH_COUNT=$(jq '[.matches[] | select(.vulnerability.severity=="High")] | length' grype-results.json)
          
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 1 ]; then
            echo "❌ FAILED: Found $CRITICAL_COUNT critical vulnerabilities (threshold: 1)"
            exit 1
          fi
          
          if [ "$HIGH_COUNT" -gt 5 ]; then
            echo "❌ FAILED: Found $HIGH_COUNT high vulnerabilities (threshold: 5)"
            exit 1
          fi
          
          echo "✅ PASSED: Vulnerability counts within acceptable thresholds"

      - name: Upload Grype results
        if: always ()
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: |
            grype-results.json
            grype-results.txt
