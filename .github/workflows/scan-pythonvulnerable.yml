name: Security Scan - Python Vulnerable Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'vulnerable-app/**'
      - '.github/workflows/scan-pythonvulnerable.yml'
  pull_request:
    branches:
      - main
      - devlop
  workflow_dispatch:

jobs:
  scan-vulnerable-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vulnerable python image
        run: |
          docker build -f vulnerable-app/dockerfile.python-vulnerable -t pythonapp-demo:latest vulnerable-app/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pythonapp-demo:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-python-vulnerable.txt

      - name: Run Trivy JSON output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pythonapp-demo:latest
          format: json
          output: trivy-report-python.json
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Security policy check
        run: |
          CRITICAL_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL" and .FixedVersion != "")] | length' trivy-report-python.json)
          HIGH_COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" and .FixedVersion != "")] | length' trivy-report-python.json)
          echo "Critical vulnerabilities (with fixes): $CRITICAL_COUNT"
          echo "High vulnerabilities (with fixes): $HIGH_COUNT"
          if [ "$CRITICAL_COUNT" -eq 0 ] && [ "$HIGH_COUNT" -lt 5 ]; then
            echo "Security policy passed: Image is safe to deploy"
          else
            echo "Security policy failed: Image has too many vulnerabilities"
            exit 1
          fi

      - name: Upload vulnerable python image report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-python-vulnerable-report
          path: |
            trivy-python-vulnerable.txt
            trivy-report-python.json

      - name: Display summary
        run: |
          echo "## Security Scan Results - Vulnerable Python Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remediated Image Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: pythonapp-demo:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat trivy-python-vulnerable.txt >> $GITHUB_STEP_SUMMARY
